<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0046a8" />
    <title>AN POS - نظام نقاط البيع</title>
    <link rel="icon" type="image/x-icon" href="/an-pos-icon.ico">
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      *, *::before, *::after {
        font-family: inherit;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:'Cairo',sans-serif;">
        <div style="width:56px;height:56px;background:#2563eb;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin-bottom:14px;box-shadow:0 8px 20px rgba(37,99,235,0.4);">AN</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:12px;">جاري تحميل AN POS...</div>
        <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.15);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      </div>
    </div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML =
            '<div style="padding:20px;color:#ff4444;font-family:monospace;direction:rtl;background:#111;min-height:100vh">' +
            '<h2>خطأ في التطبيق</h2><p>' + msg + '</p>' +
            (src ? '<p style="font-size:12px;color:#888">File: ' + src + ' Line: ' + line + '</p>' : '') +
            (err && err.stack ? '<pre style="font-size:11px;color:#aaa;white-space:pre-wrap">' + err.stack + '</pre>' : '') +
            '</div>';
        }
      };
      window.onunhandledrejection = function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML =
            '<div style="padding:20px;color:#ff4444;font-family:monospace;direction:rtl;background:#111;min-height:100vh">' +
            '<h2>خطأ غير متوقع</h2><pre style="font-size:12px;white-space:pre-wrap">' +
            (e.reason?.stack || e.reason?.message || String(e.reason)) + '</pre></div>';
        }
      };
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
