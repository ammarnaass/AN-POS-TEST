name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Package NSIS + Portable + MSI + MSIX (unsigned)
        if: ${{ env.CSC_LINK == '' }}
        run: npx electron-builder --win nsis portable msi appx --x64

      - name: Package NSIS + Portable + MSI + MSIX (signed)
        if: ${{ env.CSC_LINK != '' }}
        run: npx electron-builder --win nsis portable msi appx --x64 -c.forceCodeSigning=true

      - name: Verify Clean Package (No Linux/Darwin Binaries)
        run: node scripts/check-package-contents.mjs

      - name: Verify Code Signatures (Unsigned mode report)
        if: ${{ env.CSC_LINK == '' }}
        run: node scripts/verify-signature.mjs

      - name: Verify Code Signatures (Signed mode enforcement)
        if: ${{ env.CSC_LINK != '' }}
        run: node scripts/verify-signature.mjs --require-signed

      - name: Generate SHA-256 Checksums
        run: node scripts/generate-checksums.mjs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anpos-windows-release
          path: |
            release/*.exe
            release/*.msi
            release/*.msix
            release/*.appx
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anpos-windows-release
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/*.msix
            release/*.appx
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          generate_release_notes: true

